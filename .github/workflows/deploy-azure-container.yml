name: Deploy Container to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_NAME: aioreadyregistry
  REGISTRY_LOGIN_SERVER: aioreadyregistry.azurecr.io
  IMAGE_NAME: aio-ready/web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $REGISTRY_NAME

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      - name: Update Web App container configuration
        env:
          IMAGE_TAG: ${{ github.sha }}
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --docker-custom-image-name $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG \
            --docker-registry-server-url https://$REGISTRY_LOGIN_SERVER

      - name: Restart Web App
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: az webapp restart --name $WEBAPP_NAME --resource-group $RESOURCE_GROUP
